[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

# 0G Galileo testnet (chain 16602). Deploy with:
#   forge script script/Deploy.s.sol --rpc-url $ZEROG_CHAIN_RPC \
#     --private-key $ZEROG_CHAIN_KEY --broadcast
[rpc_endpoints]
galileo = "${ZEROG_CHAIN_RPC}"
